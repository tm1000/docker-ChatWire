services:
  cw-a:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    healthcheck:
        disable: true
    ports:
      - "10000:10000/udp"  # Game port (cw-a/cw-local-config.json Port)
#      - "20000:20000/tcp"  # RCON port (Port + Global Options.RconOffset)
    volumes:
      - ./data:/chatwire
      - ./www:/www
      - ./softmod:/softmod:ro
    environment:
      - CW_DIR=/chatwire/cw-a
      # - CW_ARGS=-regCommands  # Flags passed to /bin/ChatWire (default: none). Set once
      #                         # on first boot, or after a slash command changes.
    cap_add:
      - SYS_NICE  # For process priority management

  # Second server, sharing the same Discord bot + cw-global-config.json.
  # After first boot, edit data/cw-b/cw-local-config.json: set Port to
  # something distinct and Channel.ChatChannel to a different channel.
  # cw-b:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   user: "1000:1000"
  #   healthcheck:
  #       disable: true
  #   ports:
  #     - "10001:10001/udp"  # Game port (cw-b/cw-local-config.json Port)
  #     - "20001:20001/tcp"  # RCON port (Port + Global Options.RconOffset)
  #   volumes:
  #     - ./data:/chatwire
  #     - ./www:/www
  #     - ./softmod:/softmod:ro
  #   environment:
  #     - CW_DIR=/chatwire/cw-b
  #   cap_add:
  #     - SYS_NICE  # For process priority management

  # Live web map (https://github.com/martydingo/factorio-mapshot-docker,
  # rendering cw-a's saves with Palats/mapshot), served at /mapshot/ through
  # the `web` container below — no host port published. Opt-in: this block
  # has no credentials in it, so copy it into docker-compose.override.yml
  # instead (a filled-in version is in docker-compose.override.yml.example)
  # and also uncomment the matching /mapshot/, /data/ and /latest/ locations
  # in docker-files/nginx.conf. See "Map viewer (mapshot)" in README.md.
  # mapshot-render:
  #   image: martydingo/mapshot:latest
  #   restart: unless-stopped
  #   user: "1000:1000"
  #   environment:
  #     - FACTORIO_USERNAME=  # same factorio.com account as
  #     - FACTORIO_TOKEN=     # data/cw-global-config.json's Factorio.Username/Token
  #     - MAPSHOT_MODE=render
  #     - MAPSHOT_SAVE_MODE=latest  # always render whatever save is newest on disk
  #     - MAPSHOT_INTERVAL=600      # max seconds per render before it's killed
  #   volumes:
  #     - ./data/cw-a/factorio/saves:/opt/factorio/saves:ro
  #     - ./www/mapshot:/mapshot  # also where mapshot's own Factorio copy lands (~1GB)
  #
  # mapshot-serve:
  #   image: martydingo/mapshot:latest
  #   restart: unless-stopped
  #   user: "1000:1000"
  #   environment:
  #     - MAPSHOT_MODE=serve
  #   volumes:
  #     - ./www/mapshot:/mapshot

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker-files/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www/public_html:/usr/share/nginx/html
      # Serves the "Log:" links ChatWire posts after bans/moderation actions
      # (LogsPathWeb URL: /current-logs/<Callsign>/<file>). Mounted outside
      # the www/public_html tree above; nginx.conf's /current-logs/ location
      # uses `alias` to map the URL back onto this separate path. The path
      # segment after current-logs/ must match cw-a/cw-local-config.json's
      # Callsign ("c") — update this if you ever change it. Add one line per
      # server for a multi-server setup.
      - ./data/cw-a/log:/var/www/current-logs/c:ro