server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # No index.html and no autoindex here — requesting "/" still returns 403.
    location / {
    }

    location /archive/ {
        autoindex on;
    }

    location /current-logs/ {
        alias /var/www/current-logs/;
        autoindex on;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
