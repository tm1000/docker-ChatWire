server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # No index.html and no autoindex here — requesting "/" still returns 403.
    location / {
    }

    location /archive/ {
        autoindex on;
    }

    location /current-logs/ {
        alias /var/www/current-logs/;
        autoindex on;
    }

    # mapshot (https://github.com/martydingo/factorio-mapshot-docker) live
    # map viewer, proxied to the mapshot-serve container — see the
    # commented mapshot-render/mapshot-serve blocks in docker-compose.yml
    # and "Map viewer (mapshot)" in README.md. Uncomment together with
    # those. mapshot's own frontend hardcodes /data/ (tile images) and
    # /latest/ (permalinks) as root-absolute paths and 301s bare "/map" to
    # "/map/", so those need their own top-level locations here rather than
    # nesting cleanly under /mapshot/ alone.
    #
    # location /mapshot/ {
    #     proxy_pass http://mapshot-serve:8080/;
    # }
    #
    # location = /mapshot/map {
    #     return 301 /mapshot/map/$is_args$args;
    # }
    #
    # location /mapshot/map/ {
    #     proxy_pass http://mapshot-serve:8080/map/;
    # }
    #
    # location /data/ {
    #     proxy_pass http://mapshot-serve:8080/data/;
    # }
    #
    # location /latest/ {
    #     proxy_pass http://mapshot-serve:8080/latest/;
    # }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
